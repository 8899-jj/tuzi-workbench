// ============================================================
// DATA STORE

const STORE_KEY = 'bunny_wb_mobile';

function getDefaultData() {
  const today = new Date();
  const fmt = (d) => { const y = d.getFullYear(); const m = String(d.getMonth()+1).padStart(2,'0'); const day = String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${day}`; };
  const t = fmt(today);
  const t1 = fmt(new Date(today.getTime() + 86400000));
  const t2 = fmt(new Date(today.getTime() + 2*86400000));
  const t3 = fmt(new Date(today.getTime() + 3*86400000));
  const t4 = fmt(new Date(today.getTime() + 4*86400000));

// ============================================================
// UTILS
// ============================================================
function F(n) { return '¥' + Number(n).toFixed(2); }
function toast(msg) {
  const c = document.getElementById('toastContainer');
  const el = document.createElement('div');
  el.className = 'toast'; el.textContent = msg;
  c.appendChild(el);
  setTimeout(() => el.remove(), 2000);
}

// ============================================================
// NAVIGATION
// ============================================================
let currentPage = 'dashboard';

document.querySelectorAll('.nav-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentPage = btn.dataset.page;
    renderPage(currentPage);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
});

// ============================================================
// RENDER ENGINE
// ============================================================
function renderPage(page) {
  const main = document.getElementById('mainContent');
  switch(page) {
    case 'dashboard': main.innerHTML = renderDashboard(); break;
    case 'taobao-hot': main.innerHTML = renderTaobaoHot(); break;
    case 'taobao-orders': main.innerHTML = renderTaobaoOrders(); break;
    case 'taobao-products': main.innerHTML = renderTaobaoProducts(); break;
    case 'taobao-profit': main.innerHTML = renderTaobaoProfit(); break;
    case 'xhs-inspo': main.innerHTML = renderXhsInspo(); break;
    case 'xhs-learning': main.innerHTML = renderXhsLearning(); break;
    case 'xhs-viral': main.innerHTML = renderXhsViral(); break;
    case 'xhs-calendar': main.innerHTML = renderXhsCalendar(); break;
    case 'xhs-license': main.innerHTML = renderXhsLicense(); break;
    case 'xhs-analytics': main.innerHTML = renderXhsAnalytics(); break;
    case 'work-reports': main.innerHTML = renderWorkReports(); break;
    case 'work-schedule': main.innerHTML = renderWorkSchedule(); break;
    case 'side-hustle': main.innerHTML = renderSideHustle(); break;
  }
  bindPageEvents(page);
}

// TAOBAO PROFIT
// ============================================================
function renderTaobaoProfit() {
  const totalProfit = data.orders.filter(o => o.status !== '已取消').reduce((s, o) => s + o.profit, 0);
  const totalRevenue = data.orders.filter(o => o.status !== '已取消').reduce((s, o) => s + o.price, 0);
  const avgMargin = totalRevenue > 0 ? ((totalProfit / totalRevenue) * 100).toFixed(1) : '0';

  const monthly = {};
  data.orders.forEach(o => {
    const m = o.date.substring(0, 7);
    if (!monthly[m]) monthly[m] = { revenue: 0, profit: 0, count: 0 };
    monthly[m].revenue += o.price;
    monthly[m].profit += o.profit;
    monthly[m].count += 1;
  });

  return `
    <div class="sec-title">💰 利润分析</div>

    <div class="stat-row">
      <div class="stat-item pink"><div class="si-label">总利润</div><div class="si-value">${F(totalProfit)}</div></div>
      <div class="stat-item purple"><div class="si-label">总营收</div><div class="si-value">${F(totalRevenue)}</div></div>
      <div class="stat-item cyan"><div class="si-label">利润率</div><div class="si-value">${avgMargin}%</div></div>
      <div class="stat-item orange"><div class="si-label">总订单</div><div class="si-value">${data.orders.length}</div></div>
    </div>

    <div class="card">
      <div class="card-header"><div class="card-title">📅 月度汇总</div></div>
      ${Object.entries(monthly).sort().reverse().map(([m, d]) => `
        <div class="order-item">
          <span style="font-weight:600;">${m}</span>
          <span style="font-size:0.7rem;color:var(--text-muted);">${d.count}单</span>
          <span style="font-size:0.75rem;color:var(--text-muted);margin-left:auto;margin-right:8px;">营收${F(d.revenue)}</span>
          <span class="oi-amount">+${F(d.profit)}</span>
        </div>
      `).join('')}
    </div>

    <div class="card" style="margin-top:10px;">
      <div class="card-header"><div class="card-title">💡 提升销量建议</div></div>
      <div style="font-size:0.78rem;line-height:1.8;color:var(--text-muted);">
        <p>📌 <b>标题优化</b>：加入热搜关键词（法式/ins风/Y2K/小众设计）</p>
        <p>📌 <b>主图优化</b>：白底+模特佩戴+细节特写 3张组合</p>
        <p>📌 <b>定价策略</b>：设置满2件包邮，提高客单价</p>
        <p>📌 <b>评价管理</b>：主动邀请买家晒图评价</p>
        <p>📌 <b>上新频率</b>：每周至少上3款新品保持活跃</p>
      </div>
    </div>
  `;
}

function showModal(name) {
  const existing = document.getElementById('modal-' + name);
  if (existing) existing.remove();

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay show';
  overlay.id = 'modal-' + name;
  overlay.innerHTML = getModalContent(name);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
  document.body.appendChild(overlay);
}

function copyProduct(name, cost, sell) {
  if (!data.copiedProducts) data.copiedProducts = [];
  if (!data.copiedProducts.includes(name)) {
    data.copiedProducts.push(name);
    // Also add to products
    data.products.push({
      id: Date.now(),
      name: name,
      source: '1688',
      sourcePrice: cost,
      targetPrice: sell,
      margin: ((sell-cost)/sell*100).toFixed(1) + '%',
      status: '已上架',
      notes: '从爆款选品搬运'
    });
    saveData();
    toast('✅ 已搬运到我的选品！');
    renderPage('taobao-hot');
  } else {
    toast('已搬运过了~');
  }
}

  if (modals.length > 0) modals[modals.length - 1].remove();
}

function navigateTo(page) {
  currentPage = page;
  document.querySelectorAll('.nav-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.page === page);
  });
  renderPage(page);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function openLink(url) {
  const a = document.createElement('a');
  a.href = url;
  a.target = '_blank';
  a.rel = 'noopener noreferrer';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

function copyToClipboard(text) {
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(() => toast('📋 已复制到剪贴板'));
  } else {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
    toast('📋 已复制到剪贴板');
  }
}

renderPage('dashboard');

// 全局链接点击处理 — 确保所有 target="_blank" 链接在手机上能正常打开
document.addEventListener('click', function(e) {
  const link = e.target.closest('a');
  if (link && link.href && link.href.startsWith('http')) {
    e.preventDefault();
    window.open(link.href, '_blank');
  }
});
